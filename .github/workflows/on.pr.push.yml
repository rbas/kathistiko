name: Build and test

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_on_ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Checking code syntax
        run: cargo clippy
      - name: Build
        run: cargo build --verbose
      - name: test
        run: cargo test

  build_on_macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3
      - name: Checking code syntax
        run: cargo clippy
      - name: Build
        run: cargo build --verbose
      - name: test
        run: cargo test

  build_firmware:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio==6.1.19
      - name: Create CI firmware configuration
        run: cp firmware/include/conf.example.h firmware/include/conf.h
      - name: Build ESP32 firmware
        run: pio run --project-dir firmware
